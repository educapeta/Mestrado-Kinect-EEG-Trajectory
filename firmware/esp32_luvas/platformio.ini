; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = upesy_wroom
framework = arduino
; GRAVACAO EM MODO MANUAL (medido em 19/10/2026): o auto-reset desta placa nao
; entra em download mode e o pulso DTR/RTS do esptool derruba o CP210x
; (PermissionError "dispositivo nao esta funcionando"). --before=no_reset NAO
; mexe em DTR/RTS: coloque a placa em download mode na mao (segure BOOT,
; aperte/solte EN, solte BOOT) antes de gravar. 115200 pelo bridge instavel.
upload_speed = 115200
; A opcao de BOARD e' a que troca o reset (o builder usa
; board.get("upload.before_reset")): um upload_flags --before ficaria antes do
; default_reset e o ultimo venceria (medido em 19/10/2026).
board_upload.before_reset = no_reset
board_upload.after_reset = hard_reset

; ------------------------------------------------------------------
; LUVA DIREITA  ->  envia UDP broadcast na porta 4210
; (casa com imu.py: IMU_PORTAS_PADRAO = {1: 4210, 2: 4211}, lado 1 = direita)
; ------------------------------------------------------------------
[env:luva_direita]
build_flags = -D GLOVE_SIDE=1

; ------------------------------------------------------------------
; LUVA ESQUERDA ->  envia UDP broadcast na porta 4211
; ------------------------------------------------------------------
[env:luva_esquerda]
build_flags = -D GLOVE_SIDE=0
