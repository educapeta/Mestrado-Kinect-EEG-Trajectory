; ============================================================================
; TESTE AHRS 2x MPU6050 -- vetores 3D (item 142)
; Projeto separado do firmware das luvas: NAO usa Wi-Fi/UDP, so' serial.
;
; Gravar (mesma placa; com BOOT por causa do CP210x desta bancada):
;   pio run -d firmware/esp32_teste_ahrs -t upload
; Monitor:
;   pio device monitor -d firmware/esp32_teste_ahrs
;
; Depois de testar, grave de volta o firmware das luvas:
;   pio run -d firmware/esp32_duas_imus -t upload
; ============================================================================
[env:esp32_teste_ahrs]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = hard_reset
build_flags = -D ADDR_DIREITO=0x68 -D ADDR_ESQUERDO=0x69
