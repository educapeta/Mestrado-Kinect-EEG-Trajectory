; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = upesy_wroom
framework = arduino
; A serial do firmware sai a 115200 (sondeo I2C, bias, `1,<dados>` / `2,<dados>`
; e as linhas do Wi-Fi). Sem isto o `pio device monitor` abre a 9600 e mostra
; "caracteres confusos" -- medido na bancada em 13/10/2026.
monitor_speed = 115200

; ------------------------------------------------------------------
; ESP32 com DOIS MPU6050 (uma mao cada) -> envia UDP nas portas 4210
; (direita, MPU endereco 0x68) e 4211 (esquerda, MPU endereco 0x69).
; Um unico ESP32 substitui as duas luvas antigas.
;
; imu.py: IMU_PORTAS_PADRAO = {1: 4210, 2: 4211}, lado 1 = direita.
; Os blocos IMU_L_*/IMU_R_* do CSV de movimento entram corretos.
; ------------------------------------------------------------------
[env:esp32_duas_imus]
; Nao define GLOVE_SIDE: este firmware gerencia os DOIS lados internamente.
; Portas UDP fixas: 4210 (direita) e 4211 (esquerda).
; Para alterar QUAL MPU e' direita/esquerda, troque os enderecos I2C
; ADDR_DIREITO / ADDR_ESQUERDO abaixo e recompile (sem precisar trocar
; fisicamente os cabos -- o lado e' determinado pelo endereco I2C).
build_flags = -D ADDR_DIREITO=0x68 -D ADDR_ESQUERDO=0x69

; --- GRAVACAO EM MODO MANUAL (medido em 19/10/2026) -------------------------
; O auto-reset desta placa NAO entra em download mode e o pulso de DTR/RTS do
; esptool faz o CP210x cair no meio da configuracao da porta:
;   PermissionError(13, 'Um dispositivo conectado ao sistema nao esta
;   funcionando') -- DeviceSelectiveSuspended=1, driver CP210x 6.7.4.261.
; Com `--before=no_reset` o esptool NAO mexe em DTR/RTS: coloque a placa em
; download mode NA MAO antes de gravar (segure BOOT, aperte/solte EN, solte
; BOOT). 115200 porque o bridge desta maquina esta' instavel no 460800.
upload_speed = 115200
; O builder do espressif32 monta o comando com
;   --before board.get("upload.before_reset", "default_reset")
; e um upload_flags com --before ficaria ANTES do default_reset (o ultimo
; vence) -- medido em 19/10/2026. A opcao de BOARD abaixo e' a que troca o
; reset de verdade:
board_upload.before_reset = no_reset
board_upload.after_reset = hard_reset


; ------------------------------------------------------------------
; OTA (item 129): depois de gravar UMA vez o firmware por USB (com BOOT),
; os proximos uploads podem ser por Wi-Fi, sem cabo/BOOT:
;   pio run -e esp32_duas_imus_ota -t upload
; Requisitos: hotspot ligado e o ESP32 na mesma rede (IP abaixo; ajuste o
; --upload-port se o IP mudar). A senha TEM de bater com OTA_SENHA do
; firmware (padrao "mestrado", ver credenciais.h). Se o Wi-Fi falhar, a
; recuperacao continua sendo USB (env esp32_duas_imus, com BOOT).
; ------------------------------------------------------------------
[env:esp32_duas_imus_ota]
extends = env:esp32_duas_imus
upload_protocol = espota
upload_port = 192.168.137.83
upload_flags = --auth=mestrado
