; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = upesy_wroom
framework = arduino

; ------------------------------------------------------------------
; ESP32 com DOIS MPU6050 (uma mao cada) -> envia UDP nas portas 4210
; (direita, MPU endereco 0x68) e 4211 (esquerda, MPU endereco 0x69).
; Um unico ESP32 substitui as duas luvas antigas.
;
; imu.py: IMU_PORTAS_PADRAO = {1: 4210, 2: 4211}, lado 1 = direita.
; Os blocos IMU_L_*/IMU_R_* do CSV de movimento entram corretos.
; ------------------------------------------------------------------
[env:esp32_duas_imus]
; Nao define GLOVE_SIDE: este firmware gerencia os DOIS lados internamente.
; Portas UDP fixas: 4210 (direita) e 4211 (esquerda).
; Para alterar QUAL MPU e' direita/esquerda, troque os enderecos I2C
; ADDR_DIREITO / ADDR_ESQUERDO abaixo e recompile (sem precisar trocar
; fisicamente os cabos -- o lado e' determinado pelo endereco I2C).
build_flags = -D ADDR_DIREITO=0x68 -D ADDR_ESQUERDO=0x69
